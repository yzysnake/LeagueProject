# ---------------------------------------------------------------------------
# UNKNOWN 兜底策略（§3.11.5 要求显式写出；§3.11.4 要求告警不阻塞）
# ---------------------------------------------------------------------------
unknown_policy:
  bucket: UNKNOWN
  tier: 0
  on_unregistered_code:
    - 1. canon_league() 记 WARNING 并返回 UNKNOWN，**不抛异常**：新赛区上线不得让管道崩。
    - 2. 该场比赛照常进 silver/训练，league_canon=UNKNOWN、league_tier=0。
    - 3. UNKNOWN 桶是一个真实的 categorical level，不是 NaN；模型里它就是「没见过的小赛区」。
    - 4. scripts/audit_leagues.py 以退出码 1 告警（CI 红），人工登记后重新生成本文件。
    - 5. 绝不允许把 UNKNOWN 并进任何一线赛区，也绝不允许用 get_dummies 现场生成赛区特征。
  forbidden:
    - 任何地方都不得用原始 code 定义 tier-1：照抄 2024 的 code 过滤，2025 会丢 LTA N+LTA S 共 436 场；
      照抄 2025 的 code 过滤，2026 会丢 LCS+CBLOL 共 482 场。两个方向都会静默丢一整年北美+巴西比赛。
    - 不得对 UNKNOWN 做 assert/raise（§3.11.4：覆盖率监控绝不能做成启动 assert）。

tier_definition:
  "2": 国际赛 —— 参赛队来自 ≥3 个不同常规赛区的跨区赛事
  "1": 一线赛区 —— 该赛季把队伍送上 WLDs/MSI/IWCI/MSC 的顶级地区联赛
  "0": 二级 / 青训 / 业余 / 地区联赛 / 国内杯赛（含未知）
  authority: >-
    现役一线口径以已冻结的 eval/tier1_leagues.yaml 为准；该文件没覆盖到的历史赛区，
    用「该赛季是否有队伍出现在 WLDs/MSI（原始队名精确匹配）」客观判定。
    国内杯赛（DCup/KeSPA Cup/NEST）的参赛队虽然也进世界赛，但它们不是地区联赛，判 tier 0。

